[settings]
go_set_gobin = false

[tools]
# バレ名 npm はバージョン解決に失敗する (mise 2026.6.14) ためバックエンドを明示。
# npm 12 は node ^22.22.2 || ^24.15.0 || >=26.0.0 を要求し、
# node 20.18.1 / 24.11.1 を pin するリポジトリと衝突するため major 11 に固定。
# node 同梱の npm に PATH で勝たせるため node より前に宣言する。
# aqua:npm/cli は darwin/linux のみ対応のため linux 限定。Windows は node 同梱 npm (11.x) を使う。
"aqua:npm/cli" = { version = "11", os = ["linux"] }
node = "24"
pnpm = "10"

"npm:gitmoji-cli" = "latest"
goreleaser = "latest"
bat = "latest"
"npm:neovim" = "latest"
"npm:prettier" = "latest"
"npm:cspell" = "latest"
"aqua:neovim/neovim" = "latest"
python = "3.12"
fzf = "latest"
starship = "latest"
ghq = "latest"
lazygit = "latest"
delta = "latest"
zig = "latest"
fd = "latest"
gh = "latest"
go = "latest"
jq = "latest"
glab = "latest"
uv = "latest"
bun = "latest"
rust = "latest"
"npm:difit" = "latest"
"npm:@googleworkspace/cli" = "latest"
"npm:@github/copilot" = "latest"
dotnet = "10"
just = "latest"
"npm:@playwright/cli" = "0.1.12"
"npm:@mermaid-js/mermaid-cli" = "latest"
"npm:bats" = "latest"
"cargo:cargo-sweep" = "latest"
"pipx:sqlfluff" = "3.4.0"
"cargo:cargo-watch" = "latest"
herdr = { version = "latest", os = ["linux"] }
aws-vault = "latest"
duckdb = "latest"
kubectl = "latest"

